<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ghost Identifier</title>

    <!--link rel="stylesheet" href="css/style.css"-->

    <script src="ghosts.js" defer></script>
    <script src="main.js" defer></script>
</head>

<body>

    <main class="container">

        <h1>Ghost Identifier</h1>

        <h2 id="ghost-name"></h2>

        <section class="rules">

            <div class="rule-column">
                <h3>Behaviour</h3>
                <div id="behaviour-rules"></div>
            </div>

            <div class="rule-column">
                <h3>Events</h3>
                <div id="event-rules"></div>
            </div>

            <div class="rule-column">
                <h3>Hunts</h3>
                <div id="hunt-rules"></div>
            </div>

        </section>

        <section class="score">

            <h3>Ghost Probability</h3>
            <h1 id="percentage">0%</h1>

            <div class="ghost-column">
                <h3>Ghosts</h3>
                <div id="ghosts"></div>
            </div>

        </section>

    </main>

</body>
</html>
